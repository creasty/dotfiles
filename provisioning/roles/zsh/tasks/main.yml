- ansible.builtin.set_fact:
    zsh_bin: '{{ homebrew_prefix }}/bin/zsh'

- name: install zsh
  community.general.homebrew:
    name:  zsh
    state: latest

- name: install plugins
  ansible.builtin.shell: |
    git -C {{ dotfiles_path | quote }} submodule sync --recursive > /dev/null
    git -C {{ dotfiles_path | quote }} submodule update --init --recursive
  register: zsh_plugins
  changed_when: zsh_plugins.stdout != ""

- name: add zsh to /etc/shells
  ansible.builtin.lineinfile:
    dest: /etc/shells
    line: '{{ zsh_bin }}'
  become: true

- name: check presence of /etc/zshenv
  ansible.builtin.stat:
    path: /etc/zshenv
  register: zshenv_stat

- name: Rename /etc/zshenv
  ansible.builtin.command: |
    mv /etc/zshenv /etc/_zshenv
  become: true
  when: zshenv_stat.stat.exists

- name: change login shell to zsh
  ansible.builtin.user:
    name:  '{{ ansible_facts.user_id }}'
    shell: '{{ zsh_bin }}'
  become: true
