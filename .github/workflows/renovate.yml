name: renovate

# Merges a Renovate pull request that Renovate leaves to the owner (one without
# auto-merge) once Copilot's review of its last commit recommends approval with
# no open issues and every file reviewed, and the required checks pass.
# Otherwise the job fails with the reason, and the pull request waits for the
# owner with Copilot's review on it.
#
# The "renovate auto-review" ruleset has Copilot review Renovate's pull
# requests, and .github/instructions/renovate.instructions.md tells it what to
# look for. A merge with GITHUB_TOKEN starts no workflow on master, so the job
# starts apply and tests there itself.

on:
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  merge:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' &&
      !github.event.pull_request.auto_merge
    runs-on: ubuntu-24.04
    # The apply workflow's macos job takes about 30 minutes
    timeout-minutes: 90
    permissions:
      actions: write # gh workflow run
      checks: read
      contents: write # gh pr merge
      pull-requests: write # gh pr review
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      REVIEWED: ${{ github.event.review.commit_id }}
      REVIEW: ${{ github.event.review.body }}
    steps:
      - name: Check Copilot's review
        run: |
          printf '%s\n' "$REVIEW" >> "$GITHUB_STEP_SUMMARY"
          hold() {
            echo "::error::Left for the owner: $1"
            exit 1
          }
          [ "$REVIEWED" = "$HEAD" ] && [ "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" = "$HEAD" ] ||
            hold "the review isn't of the last commit"
          grep -q '^### 🟢 Approval recommended' <<< "$REVIEW" || hold "Copilot doesn't recommend approval"
          grep -q '^\*\*No open issues\*\*' <<< "$REVIEW" || hold "Copilot reports open issues"
          ! grep -q 'not reviewed</strong></summary>' <<< "$REVIEW" || hold "Copilot left files unreviewed"

      - name: Wait for the required checks
        run: gh pr checks "$PR" --required --watch --interval 60

      - name: Approve and merge
        run: |
          gh pr review "$PR" --approve --body "Copilot recommends approval with no open issues, and the required checks pass."
          gh pr merge "$PR" --squash --match-head-commit "$HEAD"
          gh workflow run apply.yml --ref master
          gh workflow run tests.yml --ref master
