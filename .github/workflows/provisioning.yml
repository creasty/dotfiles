name: provisioning

on:
  push:
  workflow_dispatch:
  schedule:
    # Every Monday, at 10:00 JST
    - cron: "0 1 * * 1"

permissions:
  contents: read

# A new push cancels the run on its branch; on master, each run has its own group
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    # Fast feedback: an evaluation error fails here in minutes instead of on the Mac
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Evaluate the configurations
        run: |
          for user in creasty runner; do
            nix eval --raw ".#darwinConfigurations.$user.config.system.build.toplevel.drvPath"
            echo
          done

  macos:
    # cf. https://github.com/actions/runner-images/tree/main/images/macos
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HOMEBREW_VERBOSE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Link to home
        run: ln -sf "$PWD" "$HOME/dotfiles"

      - name: Uninstall homebrew
        run: |
          # cf. https://github.com/homebrew/install#uninstall-homebrew
          NONINTERACTIVE=1 HAVE_SUDO_ACCESS=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)"

          # Remove residual files
          sudo rm -rf /opt/homebrew/

          # The image ships its own Rust toolchain, which would hide a broken rustup setup
          rm -rf ~/.cargo ~/.rustup

          # ...and Google Chrome, which would keep the cask from installing
          sudo rm -rf '/Applications/Google Chrome.app'

      - name: Run
        run: ./provision --show-trace
        env:
          DOTFILES_NOVERIFY: 1 # in the next step

      - name: Verify
        run: ./verify

      - name: Benchmark
        run: ./verify --bench
        env:
          DOTFILES_VERIFY_STARTUP_MS: 200 # CI's own budget, above its runners' spread (CLAUDE.md)
