name: provisioning

on:
  push:
  workflow_dispatch:
  schedule:
    # Every Monday, at 10:00 JST
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # cf. https://github.com/actions/runner-images/tree/main/images/macos
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HOMEBREW_VERBOSE: 1
      DOTFILES_NOEDIT_SECRETS: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fundamental
            tags: base,install.homebrew.tap,install.homebrew.formula
          - name: language support
            tags: base,lang
          - name: apps and system
            tags: install,app,system
            skip_tags: install.homebrew.formula
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Link to home
        run: ln -sf "$PWD" "$HOME/dotfiles"

      - name: Uninstall homebrew
        run: |
          # cf. https://github.com/homebrew/install#uninstall-homebrew
          NONINTERACTIVE=1 HAVE_SUDO_ACCESS=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)"

          # Remove residual files
          sudo rm -rf /opt/homebrew/

          # The image ships its own Rust toolchain, which would hide a broken rustup setup
          rm -rf ~/.cargo ~/.rustup

      - name: Run
        run: ./provision -vvvv --tags=${{ matrix.tags }} --skip-tags=${{ matrix.skip_tags }}
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }} # avoid GitHub API rate limits
          MISE_YES: 1

      # The image also ships node, ruby and java, so make sure ours are the ones in use
      - name: Verify
        if: matrix.name == 'language support'
        run: |
          zsh -i -c '
            set -ex
            [[ $commands[node] == ~/.local/share/mise/installs/node/* ]]
            [[ $(node --version) == v24.* ]]
            [[ $(ruby -e "print RUBY_VERSION") == 4.0.* ]]
            [[ $JAVA_HOME -ef /opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home ]]
            [[ $commands[rustup] == /opt/homebrew/opt/rustup/bin/rustup ]]
            cargo --version
          '
          bash -lc '
            set -ex
            [[ $(command -v node) == ~/.local/share/mise/shims/node ]]
            [[ $(command -v gem) == ~/.local/share/mise/shims/gem ]]
          '
