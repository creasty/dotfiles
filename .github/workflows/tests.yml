name: tests

# The test suites of the configs, which need no provisioned Mac:
#
# - hammerspoon: the specs of the Hammerspoon config (hammerspoon/tests), on a
#   fake of Hammerspoon's API.
# - nvim-e2e: the Neovim end-to-end workflow tests (nvim/tests), against the
#   plugin versions pinned in nvim/flake.lock, so a pull request (Dependabot's
#   bumps included) shows which workflows it changes. The job summary lists
#   every changed workflow.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Every Monday, at 10:00 JST
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  hammerspoon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lua 5.4, as Hammerspoon's
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4

      - name: Run the specs
        run: hammerspoon/tests/run

  nvim-e2e:
    # Same OS as the machine the behavior was pinned on.
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # Toolchain versions the plugins were pinned with: those nixpkgs
      # installs. (nvim-treesitter's main branch needs Neovim 0.12 and the
      # tree-sitter CLI 0.26.1+.)
      NVIM_VERSION: v0.12.4
      TREE_SITTER_CLI_VERSION: 0.26.8
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Outside the checkout: the tests' sandboxes must not be inside a project.
      - name: Set up directories
        run: |
          echo "E2E_PLUGINS=$RUNNER_TEMP/e2e/plugins" >> "$GITHUB_ENV"
          echo "E2E_TMPDIR=$RUNNER_TEMP/e2e/tmp" >> "$GITHUB_ENV"

      - name: Install Neovim
        run: |
          curl -fsSL "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-macos-arm64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-macos-arm64/bin" >> "$GITHUB_PATH"

      - name: Install tools
        run: |
          # nvim-treesitter builds the parsers with the tree-sitter CLI (a
          # release's own build: it asks not to use npm's)
          mkdir -p "$RUNNER_TEMP/tree-sitter"
          curl -fsSL "https://github.com/tree-sitter/tree-sitter/releases/download/v$TREE_SITTER_CLI_VERSION/tree-sitter-macos-arm64.gz" | gunzip > "$RUNNER_TEMP/tree-sitter/tree-sitter"
          chmod +x "$RUNNER_TEMP/tree-sitter/tree-sitter"
          echo "$RUNNER_TEMP/tree-sitter" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tree-sitter/tree-sitter" --version
          # the pickers' sources
          brew install fd ripgrep ghq
          nvim --version | head -1

      # Plugins and compiled parsers, saved right away so that a run whose
      # tests fail still caches them.
      - name: Restore the locked plugins
        id: plugins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e/plugins
          key: nvim-e2e-plugins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nvim/flake.lock', 'nvim/lua/user/plugin/treesitter/parsers.lua') }}

      - name: Install the locked plugins
        run: nvim/tests/plugins install

      - name: Save the locked plugins
        if: steps.plugins.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/e2e/plugins
          key: ${{ steps.plugins.outputs.cache-primary-key }}

      - name: Run the workflow tests
        run: nvim/tests/run --jobs 3 --summary "$GITHUB_STEP_SUMMARY"
