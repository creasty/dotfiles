# https://mise.jdx.dev/configuration.html
[tools]
bun = "1.4.2"
java = "21" # Homebrew's openjdk, registered with `mise link` by provisioning
node = "24.21.0"
python = "3.14.7"
ruby = { version = "4.0.7", postinstall = "sed 's/#.*//' ~/.config/mise/default-gems | xargs -n 1 gem install || true" }
# Tools from npm, each installed apart from Node, so that they run with the Node a project pins too
"npm:@antfu/ni" = "30.6.0"
"npm:@github/copilot-language-server" = "1.551.2"
"npm:@openai/codex" = "0.157.1"
"npm:bash-language-server" = "5.8.1"
"npm:eslint" = "10.11.0"
"npm:graphql-language-service-cli" = "3.5.0"
"npm:pnpm" = "12.6.0" # runs the version a project's packageManager names
"npm:typescript" = "7.0.2"
"npm:yarn" = "1.22.22"

[settings]
# Read .java-version, .node-version, .nvmrc and .ruby-version too
idiomatic_version_file_enable_tools = ["java", "node", "ruby"]
# Don't download runtimes on a "command not found" (e.g. a JDK before Homebrew's is linked)
not_found_auto_install = false
# Build with Homebrew's OpenSSL, instead of downloading prebuilt binaries
ruby.compile = true
