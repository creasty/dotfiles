# https://mise.jdx.dev/configuration.html
[tools]
bun = "1.4.4"
java = "25" # Homebrew's openjdk, registered with `mise link` on every switch
node = "24.22.2"
python = "3.15.2"
ruby = "4.0.9"
# Tools from npm and RubyGems, each installed apart from Node and Ruby, so that a project pinning another version
# still has them. npm's run on the project's Node; RubyGems' on the minor version of Ruby they were installed with,
# unless the project's Ruby has its own (e.g. from its bundle).
"npm:@antfu/ni" = "30.6.0"
"npm:@github/copilot-language-server" = "1.562.0"
"npm:@openai/codex" = "0.164.0"
"npm:bash-language-server" = "5.8.1"
"npm:eslint" = "10.13.0"
"npm:graphql-language-service-cli" = "3.5.0"
"npm:pnpm" = "12.16.0" # runs the version a project's packageManager names
"npm:typescript" = "7.0.2"
"npm:yarn" = "1.22.22"
"gem:cocoapods" = "1.17.0"
"gem:pry" = "0.16.1"
"gem:rails" = "8.1.4"

[settings]
# Read .java-version, .node-version, .nvmrc and .ruby-version too
idiomatic_version_file_enable_tools = ["java", "node", "ruby"]
# Don't download runtimes on a "command not found" (e.g. a JDK before Homebrew's is linked)
not_found_auto_install = false
# Build with Homebrew's OpenSSL, instead of downloading prebuilt binaries
ruby.compile = true
