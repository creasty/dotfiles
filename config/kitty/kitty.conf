# @see https://sw.kovidgoyal.net/kitty/conf/
#
# kitty's own tabs and splits (a tab holds splits), behind a prefix key, with a copy mode in Neovim.

#=== General
#==============================================================================================
# zsh, the user's shell, which kitty starts as a login shell. Its shell integration marks the prompts and reports the
# directory, but term.zsh sets the title and the cursor stays a block.
shell_integration no-cursor no-title

scrollback_lines 15000

# close windows without asking, and quit with the last one
confirm_os_window_close 0
macos_quit_when_last_window_closed yes

# paste without asking: zsh has bracketed paste off (zshrc), which kitty would take as unsafe
paste_actions no-op

#=== Key bindings
#==============================================================================================
# kitty's own shortcuts (Cmd+C, Cmd+V, Cmd+T...) stay

#  Prefix key
#-----------------------------------------------
# C-s; pressed twice, it goes to the program. A key without a binding goes there with it.
map ctrl+s>ctrl+s send_key ctrl+s

#  Copy & paste
#-----------------------------------------------
# copy mode: the window's screen and its history, in their colors, in Neovim over the window, to scroll, search and yank
# with vi's keys (nvim/lua/user/scrollback.lua). What runs in the window keeps running. In Neovim, C-y scrolls up.
map ctrl+y show_scrollback
map --when-focus-on cmdline:user.scrollback ctrl+y
scrollback_pager nvim -n --cmd 'set nomodeline' -c 'lua require("user.scrollback").open(INPUT_LINE_NUMBER, CURSOR_LINE, CURSOR_COLUMN)' -

# paste
map ctrl+s>p paste_from_clipboard

#  Tab & split
#-----------------------------------------------
# tab, after the current one, in the home directory
map ctrl+s>t launch --type=tab --location=after --cwd=~
map ctrl+s>ctrl+b previous_tab
map ctrl+s>ctrl+n next_tab

# split, in the directory of the window it splits. v evens out the windows, and so do = and closing one.
enabled_layouts splits:equalize_on_window_close=true
map ctrl+s>s launch --location=hsplit --cwd=current
map ctrl+s>v combine : launch --location=vsplit --cwd=current : layout_action equalize
map ctrl+s>equal layout_action equalize

# window
map ctrl+s>ctrl+h neighboring_window left
map ctrl+s>ctrl+j neighboring_window down
map ctrl+s>ctrl+k neighboring_window up
map ctrl+s>ctrl+l neighboring_window right

# resize by a cell: < > - + make the window narrower, wider, shorter, taller
map ctrl+s>shift+comma resize_window narrower
map ctrl+s>shift+period resize_window wider
map ctrl+s>minus resize_window shorter
map ctrl+s>plus resize_window taller

# close window
map ctrl+s>d close_window
map ctrl+s>c close_window

#  Others
#-----------------------------------------------
# command palette
map ctrl+s>colon command_palette

# reload the config
map ctrl+s>r load_config_file

#=== Appearance
#==============================================================================================
#  Window
#-----------------------------------------------
# as large as the screen
remember_window_size no
initial_window_width 1000c
initial_window_height 1000c

# padding: what's left of a cell goes to the right and the bottom
window_padding_width 6
placement_strategy top-left

#  Tab bar
#-----------------------------------------------
# as Neovim's tabline (nvim/lua/user/ui.lua), at the top, inside the padding: the name of each tab's directory, as
# wide as it is
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_style separator
tab_separator "∙"
tab_title_template " {tab.active_wd.rsplit('/', 1)[-1]} "
tab_bar_margin_width 6
tab_bar_margin_height 6 0
tab_bar_margin_color #1b1b1b
tab_bar_background #262626
active_tab_foreground #c0c0c0
active_tab_background #262626
active_tab_font_style normal
inactive_tab_foreground #575757
inactive_tab_background #262626
inactive_tab_font_style normal

#  Font
#-----------------------------------------------
# Menlo 12 (macOS's default), with 2px more between lines
font_family Menlo
font_size 12
modify_font cell_height 2px

#  Cursor
#-----------------------------------------------
# a steady block in the colors of the cell under it
cursor_shape block
cursor_blink_interval 0
cursor none

#  Colors
#-----------------------------------------------
# the normal colors (0-7), then the bright ones (8-15)
background #1b1b1b
foreground #c0c0c0
color0 #424242
color1 #a57572
color2 #a6b083
color3 #d0b888
color4 #8ca2b6
color5 #a186a3
color6 #9abbb6
color7 #575757
color8 #424242
color9 #b56e6a
color10 #a5b56b
color11 #d8b775
color12 #82a4c3
color13 #b07bb4
color14 #80c7bc
color15 #575757

# selection
selection_foreground #575757
selection_background #262626

#  Split
#-----------------------------------------------
# borders
active_border_color #262626
inactive_border_color #262626
