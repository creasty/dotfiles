# @see https://sw.kovidgoyal.net/kitty/conf/
#
# Neovim's window: kitty runs Neovim alone, and Neovim runs the shells and commands, in its terminals
# (nvim/lua/user/terminal.lua).

#=== General
#==============================================================================================
# Neovim, through zsh, which puts Nix's profile on PATH
shell /bin/zsh -c 'exec nvim'

# close the window with Neovim, without asking, and quit with it: ;+M (Hammerspoon) starts kitty again
close_on_child_death yes
confirm_os_window_close 0
macos_quit_when_last_window_closed yes

# no history of its own: Neovim fills the window
scrollback_lines 0

#=== Key bindings
#==============================================================================================
# Neovim gets the keys, but Cmd+N (a new window) and Cmd+W (close it)
clear_all_shortcuts yes
map super+n new_os_window
map super+w close_window

#=== Appearance
#==============================================================================================
#  Window
#-----------------------------------------------
# as large as the screen
remember_window_size no
initial_window_width 1000c
initial_window_height 1000c

# padding: what's left of a cell goes to the right and the bottom
window_padding_width 6
placement_strategy top-left

#  Font
#-----------------------------------------------
# Menlo 12 (macOS's default), with 16% more between lines and the underline a little lower
font_family Menlo
font_size 12
modify_font cell_height 116%
modify_font underline_position 1
force_ltr yes

#  Cursor
#-----------------------------------------------
cursor #a8a8a8
cursor_text_color #1a1a1a
cursor_shape block

#  Mouse
#-----------------------------------------------
# the pointer stays while typing
mouse_hide_wait 0

url_color #8397a9
url_style single

#  Colors
#-----------------------------------------------
foreground #c0c0c0
background #1b1b1b
